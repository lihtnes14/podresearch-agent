[project]
name = "pod-research-2"
version = "0.1.0"
description = "Autonomous Multi-Agent YouTube Article Generator with LangChain, LangGraph, and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "youtube-transcript-api>=0.6.2",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
